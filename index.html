<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Weather Dashboard - Real-time weather and 5-day forecast for any city">
    <title>Weather Dashboard | Real-Time Forecast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <div class="header-top">
                <div class="logo">
                    <i class="fas fa-cloud-sun"></i>
                    <h1>Weather Dashboard</h1>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <p class="subtitle">Real-time weather & 5-day forecast</p>
        </header>
        
        <!-- Search Section -->
        <div class="search-wrapper">
            <div class="search-box">
                <div class="search-input-container">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="cityInput" 
                        placeholder="Search any city..." 
                        spellcheck="false"
                        autocomplete="off"
                    >
                    <button id="searchBtn">Search</button>
                </div>
                <div id="suggestionsDropdown" class="suggestions-dropdown hidden"></div>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error hidden">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText"></span>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="spinner hidden">
            <div class="loader"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Current Weather -->
        <div id="currentWeather" class="current-weather hidden">
            <div class="weather-header">
                <h2 id="cityName"></h2>
                <button id="refreshBtn" class="refresh-btn" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="weather-main">
                <img id="weatherIcon" alt="weather icon" class="weather-icon">
                <div class="temp-container">
                    <span id="temperature"></span>
                    <span class="temp-unit">°C</span>
                </div>
            </div>
            <p id="weatherDescription" class="weather-desc"></p>
            <div class="details-grid">
                <div class="detail-card">
                    <i class="fas fa-tint"></i>
                    <div>
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value"><span id="humidity"></span>%</div>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="fas fa-wind"></i>
                    <div>
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value"><span id="windSpeed"></span> km/h</div>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="fas fa-thermometer-half"></i>
                    <div>
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value"><span id="feelsLike"></span>°C</div>
                    </div>
                </div>
                <div class="detail-card">
                    <i class="fas fa-eye"></i>
                    <div>
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value"><span id="visibility"></span> km</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Forecast Section -->
        <div class="forecast-section hidden" id="forecastSection">
            <h3><i class="fas fa-calendar-week"></i> 5-Day Forecast</h3>
            <div id="forecast" class="forecast-grid"></div>
        </div>

        <footer>
            <p>Data provided by <a href="https://openweathermap.org" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
